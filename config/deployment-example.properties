# UTF-8. Deployment mechanics example; replace demo rules with reviewed business policies.
# The current build has incomplete production acceptance; see docs/production-readiness.md.
policy.version=example-v1
deny.tools=sendEmail,deleteAll
deny.text=IGNORE_SECURITY_TEST,DEMO_SECRET_123
max.text.chars=100000
# Relative to this properties file; every tool absent from this JSON file is denied.
tool.policy.path=tool-policy-example.json
# After integrating verified application identity scopes, require context on every protected event:
# context.required=true
# Context-bound tool example: context-tool-policy-example.json

# Optional retrieval implementation allowlist; an explicitly empty value denies every retriever.
# allow.retrievers=com.example.CustomerKnowledgeRetriever
rag.max.contents=256
rag.max.metadata.entries=64

memory.max.messages=256
# Enable after integrating trusted identity and verified operation permissions.
# memory.read.permission=memory:read
# memory.write.permission=memory:write
# memory.delete.permission=memory:delete

detector.timeout.millis=500
detector.max.concurrent=4

stream.max.chars=100000
stream.max.events=2048
stream.max.active=64
stream.timeout.millis=60000

# Set an absolute path inside a private, service-owned directory before deploying.
# Each JVM must have a separate journal; do not apply external logrotate to these files.
audit.path=./var/agent-security/decisions.jsonl
audit.max.bytes=10485760
audit.backups=5
audit.force=true
audit.timeout.millis=1000
audit.queue.capacity=128

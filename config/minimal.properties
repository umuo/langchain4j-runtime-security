# UTF-8 编码；最小安全接入示例，修改工具名和文本规则后用于自己的应用。
# 未设置 audit.path：审计写标准错误输出，不由 SDK 创建本地审计文件。
# 其余配置使用默认值：MCP 操作默认拒绝，流式输出仍缓冲检查，资源限制仍生效。
# 这不是关闭安全保护或零性能开销配置；不传配置路径才跳过 Agent 初始化。

# 审计使用的策略版本标记。
policy.version=minimal-v1

# 执行前禁止这些普通工具；未设置白名单，其他普通工具通常允许。
deny.tools=sendEmail,deleteAll

# 已适配文本中的禁止子串，忽略大小写；只是字面检测，不是语义检测。
deny.text=IGNORE_SECURITY_TEST,DEMO_SECRET_123

# 单次检查提取、拼接后的文本总长度上限，不是单条消息或 token 上限。
# 模型输入包括本次全部消息文本，工具包括参数或返回文本，拼接换行也计入长度。
# 不配置或空值不限制；填写 1～10000000 的正整数后超限拒绝，不截断。
# 此空值不会关闭独立的流式缓冲、MCP 响应或工具参数 JSON 限制。
max.text.chars=

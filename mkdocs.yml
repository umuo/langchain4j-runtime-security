site_name: Agent Security Wiki
site_description: Java AI Agent 运行时安全指南
site_url: !ENV [DOCS_SITE_URL, 'http://127.0.0.1:8000/']
strict: true

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
plugins:
  - search:
      lang: [zh, en]
markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - toc:
      permalink: true
hooks:
  - scripts/docs_hooks.py
watch:
  - README.md
  - config
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - 首页: index.md
  - 入门:
      - 图解框架原理: architecture-explained.md
      - 项目概览与快速运行: overview.md
  - 安全接入:
      - 多 Agent 委托与权限: multi-agent-security.md
      - SDK 扩展与专属策略: sdk-extension.md
      - 远程安全检测客户端: remote-detector.md
      - 策略版本与回滚: policy-versioning.md
      - MCP 工具边界: mcp-security.md
      - MCP 资源与提示词: mcp-content-security.md
      - MCP 发现与容量限制: mcp-discovery-limits.md
      - MCP 分页与诊断指标: mcp-pagination-metrics.md
      - 工具权限与参数规则: tool-policy.md
      - 可信身份与异步传播: security-context.md
      - RAG 检索安全: rag-security.md
      - Memory 会话安全: memory-security.md
  - 运维与交付:
      - 可观测性与发展规划: observability.md
      - 覆盖与健康诊断: runtime-diagnostics.md
      - 性能诊断基线: performance-baseline.md
      - 恢复与子树验证: recovery-validation.md
      - Collector 与 TLS 验收: collector-acceptance.md
      - 运行与故障恢复: operations.md
      - 构建与发布工程: release-engineering.md
      - 生产验收清单: production-readiness.md
  - 设计与维护:
      - 源码学习路线: source-learning.md
      - 开发规范与代码布局: development.md
      - 技术调研与方案边界: langchain4j-runtime-security-spike.md
      - Wiki 维护指南: wiki-maintenance.md

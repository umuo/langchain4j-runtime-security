site_name: Agent Security Wiki
site_description: Java AI Agent 运行时安全指南
site_url: !ENV [DOCS_SITE_URL, 'http://127.0.0.1:8000/']
strict: true

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
plugins:
  - search:
      lang: [zh, en]
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
hooks:
  - scripts/docs_hooks.py
watch:
  - README.md
  - config
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - 首页: index.md
  - 入门:
      - 项目概览与快速运行: overview.md
  - 安全接入:
      - 工具权限与参数规则: tool-policy.md
      - 可信身份与异步传播: security-context.md
      - RAG 检索安全: rag-security.md
      - Memory 会话安全: memory-security.md
  - 运维与交付:
      - 运行与故障恢复: operations.md
      - 构建与发布工程: release-engineering.md
      - 生产验收清单: production-readiness.md
  - 设计与维护:
      - 技术调研与方案边界: langchain4j-runtime-security-spike.md
      - Wiki 维护指南: wiki-maintenance.md

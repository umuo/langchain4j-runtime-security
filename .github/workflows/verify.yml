name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify LangChain4j 1.21.0 with the packaged agent
        run: mvn -B -ntp -s .mvn/settings.xml -Dmaven.repo.local=.cache/m2 -Dlangchain4j.version=1.21.0 clean verify
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-langchain4j-1.21.0-jdk-21
          retention-days: 14
          if-no-files-found: error
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
  verify:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build, test, generate SBOM, and verify reproducibility
        run: bash scripts/release.sh
      - name: Smoke test telemetry benchmark accounting
        run: python3 scripts/benchmark_telemetry.py --iterations 1000 --threads 1 --forks 1 --capacity 64
      - name: Smoke test packaged agent benchmark accounting
        run: python3 scripts/benchmark_agent.py --iterations 20 --forks 1 --output target/benchmarks/agent-smoke.json
      - name: Smoke test exporter outage recovery
        run: |
          for mode in unavailable disconnect stall; do
            python3 scripts/probe_exporter_recovery.py --outage-seconds 1 --recovery-seconds 2 --failure-mode "$mode" --output "target/benchmarks/recovery-$mode.json"
          done
      - name: Test acceptance evidence verifier
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Accept real Collector HTTP, TLS, and mTLS
        run: python3 scripts/accept_collector.py --download-collector
      - name: Preserve test and release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-jdk-${{ matrix.java }}
          retention-days: 14
          if-no-files-found: error
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            target/release/**
            target/reproducibility.log
            target/benchmarks/**
            target/collector-acceptance/**
